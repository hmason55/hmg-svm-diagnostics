name: Check and build SVM Diagnostics
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: svm-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_package.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: svm-diagnostics-development
          path: dist/*
          if-no-files-found: error
