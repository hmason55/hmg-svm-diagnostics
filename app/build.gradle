plugins { id 'com.android.application' }

def releaseKeys = ['SVM_KEYSTORE', 'SVM_STORE_PASSWORD', 'SVM_KEY_ALIAS', 'SVM_KEY_PASSWORD']
def signingReady = releaseKeys.every { System.getenv(it) }
def releaseVersion = rootProject.file('VERSION').text.trim()

android {
    namespace 'gen5w.svm.diagnostics'
    compileSdk 35
    defaultConfig {
        applicationId 'gen5w.svm.diagnostics'
        minSdk 19
        targetSdk 19
        versionCode releaseVersion.split('\\.').inject(0) { code, digit -> code * 1000 + digit.toInteger() }
        versionName releaseVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    lint { disable 'ExpiredTargetSdkVersion' }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(System.getenv('SVM_KEYSTORE'))
                storePassword System.getenv('SVM_STORE_PASSWORD')
                keyAlias System.getenv('SVM_KEY_ALIAS')
                keyPassword System.getenv('SVM_KEY_PASSWORD')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !signingReady) {
        throw new GradleException('Configure a persistent release signing keystore before building a release.')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
